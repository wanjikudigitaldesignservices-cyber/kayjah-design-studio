<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kayjah Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#F5F5DC;color:#1A1A1A}h1,h2{font-family:'Playfair Display',serif;font-weight:400}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A1A1A}.lb{background:#ffffff;padding:60px;max-width:400px;width:100%;text-align:center;border:1px solid #D4AF37;box-shadow:0 15px 40px rgba(0,0,0,0.2)}.lb h2{color:#1A1A1A;margin-bottom:30px;font-size:2.2rem;letter-spacing:1px}.lb input{width:100%;padding:16px;border:none;border-bottom:1px solid #ccc;background:transparent;color:#1A1A1A;margin-bottom:20px;font-size:0.95rem;font-family:'Inter',sans-serif;outline:none}.lb input:focus{border-color:#D4AF37}.lb button{width:100%;padding:18px;background:#1A1A1A;color:#fff;border:none;cursor:pointer;font-size:0.85rem;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:2px;transition:0.3s}.lb button:hover{background:#D4AF37}
.dash{display:none}.dh{background:#ffffff;color:#1A1A1A;padding:30px 50px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;border-bottom:1px solid #E5E5E5}.dh h1{font-size:2rem;letter-spacing:2px}.dh button,.dh a{padding:12px 28px;border:1px solid #1A1A1A;cursor:pointer;font-size:0.8rem;color:#1A1A1A;background:transparent;text-decoration:none;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:2px;transition:0.3s}.dh button:hover,.dh a:hover{background:#1A1A1A;color:#fff}.be{background:#1A1A1A!important;color:#fff!important}.be:hover{background:#D4AF37!important;border-color:#D4AF37!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:50px}.sc{background:#ffffff;padding:40px;border:1px solid #E5E5E5;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.03)}.sl{font-size:0.8rem;color:#666;text-transform:uppercase;letter-spacing:2px}.sv{font-size:3.5rem;font-family:'Playfair Display',serif;margin-top:15px;color:#1A1A1A}
.tw{padding:0 50px 50px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:#ffffff;border:1px solid #E5E5E5}th{background:#fafafa;color:#666;padding:25px 20px;text-align:left;font-size:0.8rem;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid #E5E5E5;font-weight:500}td{padding:25px 20px;border-bottom:1px solid #E5E5E5;font-size:0.95rem;color:#333}
select.st{padding:10px;border:1px solid #ccc;font-family:'Inter',sans-serif;font-size:0.9rem;background:transparent;color:#1A1A1A;outline:none}.del{background:none;border:none;color:#999;cursor:pointer;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;transition:0.3s}.del:hover{color:#ef4444}
@media(max-width:768px){.stats{grid-template-columns:1fr}.dh{padding:20px}.tw{padding:0 20px 20px}}</style></head>
<body>
<div class="login" id="ls"><div class="lb"><h2>Studio Portal</h2><input type="text" id="u" value="admin"><input type="password" id="p" placeholder="Password"><button onclick="login()">Enter</button></div></div>
<div class="dash" id="dash">
<div class="dh"><h1>Inquiries</h1><div><button class="be" onclick="exp()">Export</button> <a href="index.html">View Site</a> <button onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="sc"><div class="sl">Total Inquiries</div><div class="sv" id="st">0</div></div><div class="sc"><div class="sl">Pending Review</div><div class="sv" id="sn" style="color:#D4AF37;font-style:italic">0</div></div><div class="sc"><div class="sl">Projects Active</div><div class="sv" id="sd">0</div></div></div>
<div class="tw"><table><thead><tr><th>Date</th><th>Client</th><th>Contact</th><th>Project Type</th><th>Details</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const K='kayjah_inquiries';if(sessionStorage.getItem('kj_admin')==='true')showD();
function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){sessionStorage.setItem('kj_admin','true');showD()}else alert('Invalid credentials')}
function logout(){sessionStorage.removeItem('kj_admin');location.reload()}
function showD(){document.getElementById('ls').style.display='none';document.getElementById('dash').style.display='block';render()}
function gd(){return JSON.parse(localStorage.getItem(K)||'[]').sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt))}
function sv(d){localStorage.setItem(K,JSON.stringify(d))}
function render(){const d=gd();document.getElementById('st').textContent=d.length;document.getElementById('sn').textContent=d.filter(x=>x.status==='Pending Review').length;document.getElementById('sd').textContent=d.filter(x=>x.status==='Active Project').length;
document.getElementById('tb').innerHTML=d.map(i=>`<tr><td>${new Date(i.submittedAt).toLocaleDateString('en-GB')}</td><td style="font-family:'Playfair Display',serif;font-size:1.2rem;color:#1A1A1A">${i.name||'—'}</td><td>${i.phone}<br><span style="color:#666;font-size:0.85rem">${i.email}</span></td><td>${i.projectType||'—'}</td><td style="max-width:300px;line-height:1.5">${i.details||'—'}</td><td><select class="st" onchange="upd(${i.id},this.value)">${['Pending Review','Consultation Booked','Proposal Sent','Active Project','Declined/Archived'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="del" onclick="del(${i.id})">Remove</button></td></tr>`).join('')}
function upd(id,s){const d=gd();const i=d.find(x=>x.id===id);if(i){i.status=s;sv(d);render()}}
function del(id){if(!confirm('Delete this inquiry?'))return;sv(gd().filter(x=>x.id!==id));render()}
function exp(){const d=gd();if(!d.length)return alert('No data');const h=['Date','Name','Phone','Email','Type','Details','Status'];const r=d.map(i=>[new Date(i.submittedAt).toLocaleDateString(),i.name,i.phone,i.email,i.projectType,(i.details||'').replace(/\n/g,' '),i.status]);const c=[h,...r].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kayjah_inquiries.csv';a.click()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
